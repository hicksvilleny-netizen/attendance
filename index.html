<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kumon Attendance Kiosk</title>
  <!-- Modern Font (Inter) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- HTML5-QRCode Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Kiosk Header & Logo */
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    .logo-img {
      max-width: 240px;
      height: auto;
      margin-bottom: 8px;
    }
    #clock {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-top: 4px;
      font-weight: 600;
    }

    /* Scanner Card Container */
    .kiosk-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    /* Camera Viewport Wrapper */
    .scanner-wrapper {
      position: relative;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    #reader {
      width: 100%;
      border: none !important;
    }
    #reader video {
      object-fit: cover !important;
      border-radius: 14px;
    }

    /* --- TARGETED CORNER FIX --- */
    /* Remove default white corner overlays and box outlines from HTML5-QRCode */
    #reader__scan_region {
      border: none !important;
      box-shadow: none !important;
    }

    /* Hide specifically the outer white corner bracket elements */
    #reader__scan_region svg path[fill="#FFFFFF"],
    #reader__scan_region svg polygon[fill="#FFFFFF"] {
      display: none !important;
    }

    /* Animated Sweeping Laser Overlay */
    .laser-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #38bdf8, transparent);
      box-shadow: 0 0 15px #38bdf8;
      animation: scanSweep 2.5s infinite ease-in-out;
      z-index: 10;
      pointer-events: none;
    }

    @keyframes scanSweep {
      0% { top: 5%; opacity: 0.2; }
      50% { top: 90%; opacity: 1; }
      100% { top: 5%; opacity: 0.2; }
    }

    /* Status Alert Popup */
    #status-card {
      margin-top: 20px;
      padding: 16px 20px;
      border-radius: 14px;
      text-align: center;
      font-weight: 600;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      display: none;
    }

    /* Alert Themes */
    .status-success { background: #065f46; color: #34d399; border: 1px solid #10b981; }
    .status-warning { background: #78350f; color: #fbbf24; border: 1px solid #f59e0b; }
    .status-error   { background: #7f1d1d; color: #fca5a5; border: 1px solid #ef4444; }
    .status-info    { background: #1e3a8a; color: #93c5fd; border: 1px solid #3b82f6; }
  </style>
</head>
<body>

  <header>
    <!-- Kumon Logo Image (Fallback to Title Text if image fails) -->
    <img 
      src="YOUR_LOGO_URL_HERE" 
      alt="Kumon Logo" 
      class="logo-img"
      onerror="this.style.display='none'; document.getElementById('alt-title').style.display='block';"
    >
    <h1 id="alt-title" style="display: none; font-size: 2rem; font-weight: 700; color: #38bdf8;">
      KUMON OF HICKSVILLE
    </h1>
    <div id="clock">12:00:00 PM</div>
  </header>

  <main class="kiosk-card">
    <div class="scanner-wrapper">
      <div class="laser-line"></div>
      <div id="reader"></div>
    </div>

    <!-- Live Status Banner -->
    <div id="status-card" class="status-info">Ready to scan...</div>
  </main>

  <script>
    // 1. UPDATE YOUR WEBAPP URL HERE
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwAQJNDVFMQ1dZOW_ikEepyPc9H0FWfjTpC5M_iv9QeQNevBY1dG8dDxynw1wy60LcV/execE";

    let isScanningPaused = false;

    // Live Clock Update
    setInterval(() => {
      document.getElementById("clock").innerText = new Date().toLocaleTimeString();
    }, 1000);

    // Audio Feedback (Beep)
    function playBeep(freq = 880, type = 'sine', duration = 0.15) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.warn("Audio Context error:", e);
      }
    }

    // UI Status Banner Controller
    function showStatus(message, theme = 'info') {
      const card = document.getElementById("status-card");
      card.className = "status-" + theme;
      card.innerText = message;
      card.style.display = "block";
    }

    // QR Code Detection Handler
    function onScanSuccess(decodedText) {
      if (isScanningPaused) return;

      isScanningPaused = true;
      playBeep(880, 'sine', 0.12); // Instant High Beep
      showStatus("Logging scan...", "info");

      fetch(`${APPS_SCRIPT_URL}?id=${encodeURIComponent(decodedText)}&mode=kiosk`)
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") {
            playBeep(1200, 'sine', 0.2); // Success Tone
            showStatus(data.message, "success");
          } else if (data.status === "duplicate" || data.status === "warning") {
            playBeep(440, 'triangle', 0.25); // Warning Tone
            showStatus(data.message, "warning");
          } else {
            playBeep(220, 'sawtooth', 0.3); // Error Tone
            showStatus(data.message || "Error processing scan.", "error");
          }
        })
        .catch(err => {
          console.error(err);
          playBeep(220, 'sawtooth', 0.3);
          showStatus("Connection failed. Try again.", "error");
        })
        .finally(() => {
          // Pause camera for 3 seconds before accepting next scan
          setTimeout(() => {
            isScanningPaused = false;
            showStatus("Ready to scan...", "info");
          }, 3000);
        });
    }

    // Start Camera Feed
    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader",
      { fps: 15, qrbox: { width: 250, height: 250 } },
      /* verbose= */ false
    );
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
