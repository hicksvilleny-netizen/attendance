<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>High-Accuracy QR Scanner</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background: #121212; color: #fff; }
    #video-container { position: relative; width: 100%; max-width: 500px; margin: 0 auto; overflow: hidden; border-radius: 12px; }
    video { width: 100%; height: auto; display: block; }
    #result { margin-top: 20px; font-size: 1.2rem; font-weight: bold; color: #4CAF50; }
  </style>
  <!-- Modern Fallback Library -->
  <script src="https://unpkg.com/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>
</head>
<body>

  <h2>QR Code Scanner</h2>
  <div id="video-container">
    <video id="webcam" playsinline></video>
  </div>
  <div id="result">Scan a QR code...</div>

  <script>
    const video = document.getElementById('webcam');
    const resultDiv = document.getElementById('result');

    async function startScanner() {
      // 1. Request High-Resolution Camera Stream with Autofocus
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { exact: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            focusMode: { ideal: "continuous" }
          }
        });
        video.srcObject = stream;
        await video.play();

        // 2. Check for Native C++ Android BarcodeDetector Engine
        if ('BarcodeDetector' in window) {
          const barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
          setInterval(async () => {
            try {
              const barcodes = await barcodeDetector.detect(video);
              if (barcodes.length > 0) {
                resultDiv.textContent = "Scanned: " + barcodes[0].rawValue;
              }
            } catch (e) { console.error(e); }
          }, 200);
        } else {
          // 3. Fallback to optimized Web Worker JS Engine
          const qrScanner = new QrScanner(
            video,
            result => resultDiv.textContent = "Scanned: " + result.data,
            { returnDetailedScanResult: true, highlightScanRegion: true }
          );
          qrScanner.start();
        }
      } catch (err) {
        resultDiv.textContent = "Camera access error: " + err.message;
      }
    }

    window.addEventListener('load', startScanner);
  </script>
</body>
</html>
