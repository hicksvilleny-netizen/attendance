<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kumon Attendance Kiosk</title>
  <!-- Modern Kids-Friendly Font -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@600;700&display=swap" rel="stylesheet">
  <!-- HTML5-QRCode Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Fredoka', 'Inter', sans-serif;
      background: #060c18;
      color: #ffffff;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      position: relative;
    }

    /* Kids Neon Background Stickers & Doodles */
    .doodle {
      position: absolute;
      font-size: 2.2rem;
      opacity: 0.85;
      user-select: none;
      pointer-events: none;
      text-shadow: 0 0 12px currentColor;
    }

    /* Top Elements */
    .doodle.atom-top     { top: 4%; left: 25%; color: #00f2fe; font-size: 2.2rem; }
    .doodle.planet-top   { top: 5%; right: 25%; color: #ffeb3b; font-size: 2.2rem; }

    /* Left Side Stickers */
    .doodle.rocket-left  { top: 25%; left: 5%; color: #ff007f; font-size: 2.4rem; transform: rotate(-20deg); }
    .doodle.star-left    { top: 42%; left: 8%; color: #ffeb3b; }
    .doodle.num-5-left   { top: 56%; left: 4%; color: #38ef7d; font-size: 2.2rem; }
    .doodle.pencil-left  { top: 70%; left: 10%; color: #38ef7d; transform: rotate(15deg); }
    .doodle.monster-bot-l{ bottom: 6%; left: 5%; color: #00f2fe; font-size: 2.5rem; }

    /* Right Side Stickers */
    .doodle.monster-top-r{ top: 22%; right: 5%; color: #38ef7d; font-size: 2.5rem; }
    .doodle.num-5-right  { top: 38%; right: 8%; color: #38ef7d; font-size: 2.2rem; }
    .doodle.num-3-right  { top: 54%; right: 6%; color: #ff007f; font-size: 2.2rem; }
    .doodle.pencil-right { top: 68%; right: 10%; color: #ffeb3b; transform: rotate(-25deg); }
    .doodle.rocket-bot-r { bottom: 6%; right: 5%; color: #ff007f; font-size: 2.5rem; transform: rotate(45deg); }

    /* Header Layout */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 2;
      text-align: center;
      margin-bottom: 8px;
    }

    .logo-container {
      background: #ffffff;
      padding: 6px 18px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
      display: inline-block;
    }

    .logo-container img {
      height: 70px; /* Sized up as requested */
      display: block;
    }

    header h1 {
      font-size: 1.6rem; /* Adjusted down slightly so the long text fits without pushing content */
      font-weight: 700;
      color: #38ef7d;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 0 12px #38ef7d, 0 0 24px #38ef7d;
      padding: 0 10px;
      max-width: 90vw;
    }

    /* Center Section (Camera Viewport) */
    main {
      position: relative;
      width: 100%;
      max-width: 380px;
      height: 240px; /* Controlled height */
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      margin: 8px 0;
    }

    .scanner-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      overflow: hidden;
      background: #020611;
      box-shadow: 0 0 20px rgba(56, 239, 125, 0.3);
    }

    #reader {
      width: 100%;
      height: 100%;
      border: none !important;
    }

    #reader video {
      object-fit: cover !important;
      width: 100% !important;
      height: 100% !important;
      border-radius: 18px;
    }

    /* Green Neon Corner Framing Overlay */
    .scanner-frame {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .corner {
      position: absolute;
      width: 32px;
      height: 32px;
      border-color: #38ef7d;
      border-style: solid;
      filter: drop-shadow(0 0 8px #38ef7d);
    }
    .top-left     { top: 8px; left: 8px; border-width: 5px 0 0 5px; border-top-left-radius: 12px; }
    .top-right    { top: 8px; right: 8px; border-width: 5px 5px 0 0; border-top-right-radius: 12px; }
    .bottom-left  { bottom: 8px; left: 8px; border-width: 0 0 5px 5px; border-bottom-left-radius: 12px; }
    .bottom-right { bottom: 8px; right: 8px; border-width: 0 5px 5px 0; border-bottom-right-radius: 12px; }

    /* Sweeping Laser Scan Line */
    .laser-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #38ef7d, transparent);
      box-shadow: 0 0 15px #38ef7d, 0 0 25px #38ef7d;
      animation: scanSweep 2.2s infinite ease-in-out;
      z-index: 11;
      pointer-events: none;
    }

    @keyframes scanSweep {
      0% { top: 8%; opacity: 0.3; }
      50% { top: 88%; opacity: 1; }
      100% { top: 8%; opacity: 0.3; }
    }

    /* Footer / System Status Banner */
    footer {
      width: 100%;
      max-width: 600px;
      z-index: 2;
      margin-top: 6px;
    }

    #status-card {
      background: rgba(8, 28, 44, 0.85);
      border: 2px solid #38ef7d;
      border-radius: 16px;
      padding: 10px 18px;
      text-align: center;
      box-shadow: 0 0 15px rgba(56, 239, 125, 0.4);
      transition: all 0.3s ease;
    }

    .status-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #00f2fe;
    }

    .status-title span {
      color: #38ef7d;
      text-shadow: 0 0 8px #38ef7d;
    }

    .status-sub {
      font-size: 0.9rem;
      color: #cbd5e1;
      margin-top: 2px;
    }

    /* Dynamic Themes for Status Updates */
    .status-success { border-color: #38ef7d !important; box-shadow: 0 0 20px rgba(56, 239, 125, 0.6); }
    .status-warning { border-color: #ffeb3b !important; box-shadow: 0 0 20px rgba(255, 235, 59, 0.6); }
    .status-error   { border-color: #ff4b4b !important; box-shadow: 0 0 20px rgba(255, 75, 75, 0.6); }

    /* ========================================================= */
    /* PORTRAIT MODE & MOBILE STYLES (Samsung S22 / A16 / Mobile) */
    /* ========================================================= */
    @media (max-width: 600px) or (orientation: portrait) {
      body {
        padding: 12px 10px;
      }

      header h1 {
        font-size: 1.25rem;
      }

      .logo-container img {
        height: 55px;
      }

      main {
        width: 90vw;
        max-width: 320px;
        height: 220px;
      }

      .doodle {
        font-size: 1.6rem !important;
        opacity: 0.5;
      }

      .doodle.atom-top   { top: 1%; left: 10%; }
      .doodle.planet-top { top: 1%; right: 10%; }
      
      .doodle.rocket-left   { top: 20%; left: 2%; }
      .doodle.monster-top-r { top: 20%; right: 2%; }

      .doodle.num-5-left    { top: 50%; left: 2%; }
      .doodle.num-3-right   { top: 50%; right: 2%; }

      .doodle.monster-bot-l { bottom: 8%; left: 2%; }
      .doodle.rocket-bot-r  { bottom: 8%; right: 2%; }

      .doodle.star-left, .doodle.pencil-left,
      .doodle.num-5-right, .doodle.pencil-right {
        display: none;
      }

      #status-card {
        padding: 8px 12px;
      }

      .status-title {
        font-size: 1rem;
      }

      .status-sub {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- Neon Kids Stickers Background Overlay -->
  <div class="doodle atom-top">⚛</div>
  <div class="doodle planet-top">🪐</div>

  <div class="doodle rocket-left">🚀</div>
  <div class="doodle star-left">★</div>
  <div class="doodle num-5-left">5</div>
  <div class="doodle pencil-left">✏</div>
  <div class="doodle monster-bot-l">👾</div>

  <div class="doodle monster-top-r">👾</div>
  <div class="doodle num-5-right">5</div>
  <div class="doodle num-3-right">3</div>
  <div class="doodle pencil-right">✏</div>
  <div class="doodle rocket-bot-r">🚀</div>

  <!-- Header Section -->
  <header>
    <div class="logo-container">
      <!-- REPLACE WITH YOUR LOGO FILE/PATH -->
      <img src="KumonofHicksvilleLOGO.jpg" alt="Kumon of Hicksville">
    </div>
    <h1>KUMON OF HICKSVILLE ATTENDANCE KIOSK</h1>
  </header>

  <!-- Camera Section -->
  <main>
    <div class="scanner-wrapper">
      <div class="scanner-frame">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>
      </div>
      <div class="laser-line"></div>
      <div id="reader"></div>
    </div>
  </main>

  <!-- Footer Status Section -->
  <footer>
    <div id="status-card" class="status-info">
      <div class="status-title">System Status: <span>[READY]</span></div>
      <div id="status-sub" class="status-sub">Position QR code in front of the camera</div>
    </div>
  </footer>

  <script>
    // REPLACE WITH YOUR ACTUAL GOOGLE APPS SCRIPT WEB APP URL
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwAQJNDVFMQ1dZOW_ikEepyPc9H0FWfjTpC5M_iv9QeQNevBY1dG8dDxynw1wy60LcV/exec";
    let isScanningPaused = false;

    function playBeep(freq = 880, type = 'sine', duration = 0.15) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.warn("Audio Context error:", e);
      }
    }

    function showStatus(titleMsg, subMsg = "", theme = 'info') {
      const card = document.getElementById("status-card");
      const titleElem = card.querySelector(".status-title");
      const subElem = document.getElementById("status-sub");

      card.className = "status-" + theme;
      titleElem.innerHTML = titleMsg;
      subElem.innerText = subMsg;
    }

    function onScanSuccess(decodedText) {
      if (isScanningPaused) return;

      isScanningPaused = true;
      playBeep(880, 'sine', 0.12);
      showStatus("Processing...", "Logging scan into system...", "info");

      fetch(`${APPS_SCRIPT_URL}?id=${encodeURIComponent(decodedText)}&mode=kiosk`)
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") {
            playBeep(1200, 'sine', 0.2);
            showStatus("Welcome!", data.message || "Logged in successfully!", "success");
          } else if (data.status === "duplicate" || data.status === "warning") {
            playBeep(440, 'triangle', 0.25);
            showStatus("Notice", data.message || "Already scanned recently.", "warning");
          } else {
            playBeep(220, 'sawtooth', 0.3);
            showStatus("Error", data.message || "Error processing scan.", "error");
          }
        })
        .catch(err => {
          console.error(err);
          playBeep(220, 'sawtooth', 0.3);
          showStatus("Connection Error", "Please try scanning again.", "error");
        })
        .finally(() => {
          setTimeout(() => {
            isScanningPaused = false;
            showStatus("System Status: <span>[READY]</span>", "Position QR code in front of the camera", "info");
          }, 3000);
        });
    }

    // Configured with videoConstraints to default to the REAR camera on mobile phones
    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader",
      { 
        fps: 15, 
        qrbox: { width: 220, height: 180 },
        videoConstraints: {
          facingMode: "environment" // Forces the rear/back camera
        }
      },
      /* verbose= */ false
    );
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
